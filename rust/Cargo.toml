[package]
name = "chadscan"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "chadscan"
crate-type = ["cdylib"]

# Keep unwinding enabled: the JNI entry point relies on catch_unwind so that no
# panic can ever cross the FFI boundary.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
