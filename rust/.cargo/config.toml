# Link the Rust cdylib against the Android NDK's clang wrappers.
# Android 9 (API 28) is the minimum supported level for this app.
[target.armv7-linux-androideabi]
linker = "/home/sarok/Android/Sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang"
rustflags = ["-C", "relocation-model=pic"]

[target.aarch64-linux-android]
linker = "/home/sarok/Android/Sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
rustflags = ["-C", "relocation-model=pic"]
